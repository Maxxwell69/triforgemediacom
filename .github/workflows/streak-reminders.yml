name: Daily streak reminders

on:
  schedule:
    # 01:00 UTC = 9:00 PM Eastern (EST) / 10:00 PM Eastern (EDT) — evening
    # nudge for anyone about to lose their streak. Adjust to taste; cron
    # times are always UTC.
    - cron: "0 1 * * *"
  # Lets you trigger a run manually from the Actions tab for testing.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call streak-reminders cron endpoint
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            "https://hub.triforgemedia.com/api/cron/streak-reminders?secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.txt
          if [ "$http_code" -ne 200 ]; then
            echo "Cron endpoint returned a non-200 status"
            exit 1
          fi
