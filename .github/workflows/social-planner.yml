name: Social planner publish

on:
  schedule:
    # Every ~5 minutes, offset from the live-sync cron.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call social-planner cron endpoint
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            --max-time 180 \
            "https://hub.triforgemedia.com/api/cron/social-planner?secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.txt
          if [ "$http_code" -ne 200 ]; then
            echo "Cron endpoint returned a non-200 status"
            exit 1
          fi
