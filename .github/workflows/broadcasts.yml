name: Recurring broadcasts

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call broadcasts cron endpoint
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            --max-time 240 \
            "https://hub.triforgemedia.com/api/cron/broadcasts?secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.txt
          if [ "$http_code" -ne 200 ]; then
            echo "Cron endpoint returned a non-200 status"
            exit 1
          fi
