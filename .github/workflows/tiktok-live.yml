name: TikTok live sync

on:
  schedule:
    # GitHub often delays/drops */5 jobs. Fire 4×/hour on off-peak minutes
    # so /live stays fresher without relying on top-of-hour queue spikes.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call tiktok-live cron endpoint
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            --max-time 90 \
            "https://hub.triforgemedia.com/api/cron/tiktok-live?secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.txt
          if [ "$http_code" -ne 200 ]; then
            echo "Cron endpoint returned a non-200 status"
            exit 1
          fi
